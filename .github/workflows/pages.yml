name: Publish Static Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish main to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          # Version every stylesheet/script URL with the commit SHA so a browser
          # can never pair a freshly deployed index.html with stale cached assets.
          VERSION="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"([A-Za-z0-9._/-]+\.(css|js))\"#\1=\"\2?v=${VERSION}\"#g" index.html
          sed -i -E "s#(from \"\./scripts/[A-Za-z0-9._-]+\.mjs)\"#\1?v=${VERSION}\"#g" analyst-review.js research-ops.js
          grep -q "styles.css?v=${VERSION}" index.html
          git commit -qam "Stamp asset versions for ${VERSION}"
          git push origin gh-pages --force

      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Published URL
        run: echo "Published to https://zxinghao.github.io/Fundemeantal-Aanalysis-MVP1/"
