<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Development Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #111;
    }
    main {
      width: min(560px, 100%);
      padding: 36px 28px;
      border-radius: 28px;
      background: white;
      box-shadow: 0 20px 60px rgba(0,0,0,.10);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 34px; }
    p { color: #666; line-height: 1.5; }
    button {
      margin-top: 18px;
      width: 100%;
      padding: 18px 20px;
      border: 0;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 700;
      background: #111;
      color: white;
    }
    #status { margin-top: 20px; min-height: 28px; font-weight: 700; color: #111; }
  </style>
</head>
<body>
  <main>
    <h1>Cloud Development Test</h1>
    <p>This page was created from ChatGPT without using the local computer development environment.</p>
    <button id="test-button" type="button">Test Cloud Development</button>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    document.getElementById('test-button').addEventListener('click', () => {
      document.getElementById('status').textContent = 'Cloud development is working';
    });
  </script>
</body>
</html>
