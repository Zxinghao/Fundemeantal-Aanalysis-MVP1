name: One-shot SGL Source URL Migration

on:
  push:
    branches:
      - research/fix-sgl-source-url
    paths:
      - scripts/migrate-sgl-source-url.mjs
      - .github/workflows/migrate-sgl-source-url.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply exact URL migration
        run: node scripts/migrate-sgl-source-url.mjs

      - name: Validate diff
        run: |
          git diff --check
          git diff --exit-code -- scripts/migrate-sgl-source-url.mjs .github/workflows/migrate-sgl-source-url.yml

      - name: Commit migrated source URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/industries.json data/source-watchlist.json app.js
          if git diff --cached --quiet; then
            echo "No URL migration changes to commit."
          else
            git commit -m "Fix SGL SIGRACET source URL"
            git push
          fi
