name: Source Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run web scanner
        run: node scripts/web-scan.mjs

      - name: Commit scan outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update source scan outputs"
          file_pattern: "data/source-cache.json data/generated-update-events.json"

      - name: Publish current site
        shell: bash
        run: |
          git fetch origin gh-pages || true
          git checkout -B gh-pages
          git push origin gh-pages --force
