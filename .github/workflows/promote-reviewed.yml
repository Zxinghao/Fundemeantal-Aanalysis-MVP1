name: Promote Reviewed Data

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PROMOTE to replace data/industries.json with data/industries.reviewed.json"
        required: true
        default: "PROMOTE"

permissions:
  contents: write
  pages: write

jobs:
  promote-reviewed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Promote reviewed data
        run: node scripts/promote-reviewed-data.mjs "${{ inputs.confirmation }}"

      - name: Commit promoted industry data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Promote reviewed industry data"
          file_pattern: "data/industries.json data/industries.previous.json"

      - name: Publish current site to gh-pages
        shell: bash
        run: |
          git fetch origin main gh-pages || true
          git checkout main
          git pull --ff-only origin main
          git checkout -B gh-pages
          git push origin gh-pages --force

      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
