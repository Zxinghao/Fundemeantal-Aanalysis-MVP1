name: OpenAI Research Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/openai-smoke-trigger.txt"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run isolated OpenAI research smoke test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESEARCH_MODEL: gpt-5.6-luna
        run: node scripts/openai-research-smoke-test.mjs
