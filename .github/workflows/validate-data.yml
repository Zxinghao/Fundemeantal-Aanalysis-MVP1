name: Validate Research Data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check scanner-event-policy.js
          node --check review-queue-gate.js
          node --check app.js
          node --check research-evidence-ui.js
          node --check analyst-review.js
          node --check research-ops.js
          node --check review-export.js
          node --check product-journey.js
          node --check dual-review-ui.js
          node --check review-nominations.js
          node --check scripts/ingest-research-nomination.mjs
          node --check tests/research-nomination-intake.test.mjs
          node --check tests/research-coverage-integrity.test.mjs
          node --check scripts/build-daily-research.mjs
          node --check scripts/reconcile-dual-research.mjs
          node --check scripts/telegram-dual-alerts.mjs
          node --check tests/dual-agent-research.test.mjs
          node --check scripts/telegram-bot-smoke-test.mjs
          node --check tests/telegram-bot-smoke-test.test.mjs
          node -e "const s=JSON.parse(require('fs').readFileSync('scripts/dual-agent-output.schema.json','utf8')); if(!s.properties?.assessments) process.exit(1)"
          node -e "const p=JSON.parse(require('fs').readFileSync('data/products.json','utf8'));if(!Array.isArray(p)||p.some(x=>!x.id||!Array.isArray(x.steps)||!x.steps.length))throw new Error('products.json malformed')"
          node --check scripts/disclosure-diff.mjs
          node --check scripts/candidate-interpretation.mjs
          node --check scripts/enrich-semantic-candidates.mjs
          node --check scripts/validate-semantic-candidates.mjs
          node --check scripts/openai-research-agent.mjs
          node --check scripts/openai-research-smoke-test.mjs
          node --check scripts/validate-llm-candidates.mjs
          node --check scripts/analyst-review-model.mjs
          node --check scripts/source-health-model.mjs
          node --check scripts/research-model.mjs
          node --check scripts/web-scan.mjs
          node --check scripts/apply-review-decisions.mjs
          node --check scripts/promote-reviewed-data.mjs
          node --check scripts/validate-data.mjs
          node --check scripts/validate-watchlist.mjs
          node --check tests/research-pipeline.test.mjs
          node --check tests/semantic-candidate.test.mjs
          node --check tests/llm-research-agent.test.mjs
          node --check tests/analyst-review-workflow.test.mjs
          node --check tests/scanner-signal-quality.test.mjs
          node --check tests/source-retry.test.mjs
          node --check tests/source-health.test.mjs
          node --check tests/scanner-event-policy.test.mjs

      - name: Run research pipeline regression tests
        run: node --test tests/research-pipeline.test.mjs tests/semantic-candidate.test.mjs tests/llm-research-agent.test.mjs tests/analyst-review-workflow.test.mjs tests/scanner-signal-quality.test.mjs tests/source-retry.test.mjs tests/source-health.test.mjs tests/scanner-event-policy.test.mjs

      - name: Test independent research and Telegram gates
        run: node --test tests/dual-agent-research.test.mjs tests/research-nomination-intake.test.mjs tests/research-coverage-integrity.test.mjs

      - name: Test dedicated Telegram bot connection handling
        run: node --test tests/telegram-bot-smoke-test.test.mjs

      - name: Test safe Claude error classification
        run: node --test tests/classify-claude-action-error.test.mjs
      - name: Validate research data integrity
        run: node scripts/validate-data.mjs

      - name: Validate source watchlist integrity
        run: node scripts/validate-watchlist.mjs

      - name: Validate semantic candidate invariants
        run: node scripts/validate-semantic-candidates.mjs

      - name: Validate LLM research candidate invariants
        run: node scripts/validate-llm-candidates.mjs
