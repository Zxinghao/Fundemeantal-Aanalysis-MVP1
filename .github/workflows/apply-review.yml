name: Apply Review Decisions

on:
  workflow_dispatch:
    inputs:
      review_file:
        description: "Path to exported review decisions JSON"
        required: true
        default: "data/review-decisions.sample.json"

permissions:
  contents: write

jobs:
  apply-review:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply approved review decisions
        run: node scripts/apply-review-decisions.mjs "${{ inputs.review_file }}"

      - name: Commit reviewed industry data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Apply approved review decisions"
          file_pattern: "data/industries.reviewed.json"
