name: Source Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/source-scan-trigger.txt"
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run web scanner
        run: node scripts/web-scan.mjs

      - name: Enrich scanner events with semantic candidates
        run: node scripts/enrich-semantic-candidates.mjs

      - name: Validate semantic candidate invariants
        run: node scripts/validate-semantic-candidates.mjs

      - name: Enrich eligible events with OpenAI research candidates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESEARCH_MODEL: gpt-5.6-luna
          OPENAI_RESEARCH_MAX_EVENTS: "5"
        run: node scripts/openai-research-agent.mjs

      - name: Validate LLM research candidate invariants
        run: node scripts/validate-llm-candidates.mjs

      - name: Commit scan outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update source scan outputs"
          file_pattern: "data/source-cache.json data/generated-update-events.json"
